name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Install dependencies
        run: nix develop --no-update-lock-file --command pnpm install --frozen-lockfile

      - name: Verify secret scanner
        run: nix develop --no-update-lock-file --command pnpm run guard:betterleaks-canary

      - name: Reject tracked local environment files
        run: nix develop --no-update-lock-file --command pnpm run guard:tracked-files

      - name: Scan changed commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: nix develop --no-update-lock-file --command pnpm run guard:secrets:ci -- "$BASE_SHA" "$HEAD_SHA"

      - name: Check formatting, lint, and types
        run: nix develop --no-update-lock-file --command pnpm run check

      - name: Run tests
        run: nix develop --no-update-lock-file --command pnpm test

      - name: Build Next.js application
        run: nix develop --no-update-lock-file --command pnpm run build

      - name: Audit production dependencies
        run: nix develop --no-update-lock-file --command pnpm audit --prod --audit-level moderate
