name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Install dependencies
        run: nix develop --no-update-lock-file --command pnpm install --frozen-lockfile

      - name: Verify release
        run: nix develop --no-update-lock-file --command pnpm run guard:changes

      - name: Audit production dependencies
        run: nix develop --no-update-lock-file --command pnpm audit --prod --audit-level moderate

      - name: Build release
        run: nix develop --no-update-lock-file --command pnpm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: nix develop --no-update-lock-file --command pnpm run deploy:built
